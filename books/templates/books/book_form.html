{% extends 'books/base.html' %}

{% block content %}
<h1>{% if form.instance.pk %}Edit Book{% else %}Create Book{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'books:book_list' %}">Cancel</a>
</form>
{% endblock %}
