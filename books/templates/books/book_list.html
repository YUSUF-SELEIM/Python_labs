{% extends 'books/base.html' %}

{% block content %}
<h1>Book List</h1>
<table border="1" cellpadding="8">
    <thead>
        <tr><th>Title</th><th>Description</th><th>Rating</th><th>Views</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td><a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a></td>
            <td>{{ book.desc|truncatechars:50 }}</td>
            <td>{{ book.rate }}</td>
            <td>{{ book.views }}</td>
            <td>
                <a href="{% url 'book_update' book.pk %}">Edit</a> |
                <a href="{% url 'book_delete' book.pk %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No books yet. <a href="{% url 'book_create' %}">Add one</a></td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
