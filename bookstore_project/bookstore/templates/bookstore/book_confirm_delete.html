{% extends 'bookstore/base.html' %}
{% block title %}Delete Book — Bookstore{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Deletion</h5>
      </div>
      <div class="card-body text-center p-5">
        <p class="fs-5">Are you sure you want to delete</p>
        <h4 class="text-danger mb-4">"{{ book.title }}"</h4>
        <p class="text-muted small">This will also delete its auto-generated ISBN. This action cannot be undone.</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
          <a href="{% url 'book_detail' book.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
