{% extends 'bookstore/base.html' %}
{% block title %}Delete Category{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white"><h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Delete Category</h5></div>
      <div class="card-body text-center p-5">
        <p>Delete category <strong>"{{ category.name }}"</strong>?</p>
        <p class="text-muted small">Books in this category won't be deleted, just unlinked.</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
          <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
